name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    steps:
      - name: Only this repository's dev branch may target prod
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BASE_BRANCH" = prod ] && { [ "$HEAD_BRANCH" != dev ] || [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; }; then
            echo 'Production releases must be dev -> prod Pull Requests from this repository.' >&2
            exit 1
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:repo
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:server
      - run: npm run build
      - run: npm run check:static
      - run: npm run check:seo
